name: Standard 4 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_fallback.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: node scripts/test-strength.mjs
      - run: node scripts/test-strength-offline.mjs
      - run: node scripts/test-account-deletion.mjs
      - run: node scripts/test-management.mjs
      - run: node scripts/test-management-offline.mjs
      - run: node scripts/test-management-reload-ui.mjs
      - run: node scripts/test-management-standard-guide.mjs
      - run: node scripts/test-resources.mjs
      - run: node scripts/test-drive-evidence.mjs
      - run: node scripts/test-apps-script.mjs
      - run: node scripts/test-score-template-print.mjs
      - run: node scripts/test-achievement.mjs
      - run: node scripts/test-achievement-register.mjs
      - run: node scripts/test-achievement-offline.mjs
      - run: node scripts/test-pps.mjs
      - run: node scripts/test-pdpc.mjs
      - run: node scripts/test-ppd.mjs
      - run: node scripts/test-ppd-filters.mjs
      - run: node scripts/test-owner-access.mjs
      - run: node scripts/test-owner-deletion.mjs
      - run: node scripts/test-transfer.mjs
      - run: node scripts/test-moeis-strength.mjs
      - run: node scripts/test-moeis-export.mjs
      - run: node scripts/test-login-overview.mjs
      - run: node scripts/test-deploy-pages-rest.mjs
      - run: node scripts/test-school-attestation.mjs
      - run: node scripts/test-module-summary-ui.mjs
      - run: node scripts/test-pdpc-compact-table.mjs
      - run: node scripts/test-standard4-privacy.mjs
      - run: node scripts/test-moeis-auto.mjs
      - run: node --test extensions/moeis-skas/tests/*.cjs
      - run: node scripts/test-school-read.mjs
      - run: node scripts/test-module-access.mjs
      - run: node scripts/test-my-tasks.mjs
      - run: node scripts/test-school-registration.mjs
      - run: node scripts/test-filling-status.mjs
      - run: node scripts/test-filling-table.mjs
      - run: node scripts/test-table-sort.mjs
      - run: node scripts/test-sortable-table.mjs
      - run: node scripts/test-progress.mjs
      - run: node scripts/test-assignment-roster.mjs
      - run: node scripts/test-teacher-roster-reports.mjs
      - run: node scripts/test-roster-lifecycle.mjs
      - run: node scripts/test-admin-pentadbir.mjs
      - run: node scripts/test-school-lists-import.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact
        env:
          SKAS_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          const artifactName = process.env.SKAS_ARTIFACT_NAME;
          for (let attempt = 0; attempt < 24; attempt++) {
            const response = await fetch(endpoint, {headers: {
              Accept: 'application/vnd.github+json',
              'Cache-Control': 'no-cache'
            }});
            if (!response.ok) throw new Error(`Artifact lookup failed: HTTP ${response.status}`);
            const result = await response.json();
            if (result.artifacts?.some(item => item.name === artifactName && !item.expired)) {
              console.log(`Pages artifact is available: ${artifactName}`);
              break;
            }
            if (attempt === 23) throw new Error('Pages artifact metadata is still unavailable. Retry this deployment.');
            console.log('Waiting for GitHub to expose uploaded Pages artifact metadata...');
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          NODE
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Deploy using REST artifact metadata
        id: deployment_fallback
        if: steps.deployment.outcome == 'failure'
        env:
          GH_PAGES_TOKEN: ${{ github.token }}
        run: node scripts/deploy-pages-rest.mjs
