name: Standard 4 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: node scripts/test-strength.mjs
      - run: node scripts/test-strength-offline.mjs
      - run: node scripts/test-account-deletion.mjs
      - run: node scripts/test-management.mjs
      - run: node scripts/test-management-offline.mjs
      - run: node scripts/test-resources.mjs
      - run: node scripts/test-drive-evidence.mjs
      - run: node scripts/test-achievement.mjs
      - run: node scripts/test-achievement-offline.mjs
      - run: node scripts/test-pps.mjs
      - run: node scripts/test-pdpc.mjs
      - run: node scripts/test-owner-access.mjs
      - run: node scripts/test-owner-deletion.mjs
      - run: node scripts/test-my-tasks.mjs
      - run: node scripts/test-school-registration.mjs
      - run: node scripts/test-progress.mjs
      - run: node scripts/test-assignment-roster.mjs
      - run: node scripts/test-teacher-roster-reports.mjs
      - run: node scripts/test-roster-lifecycle.mjs
      - run: node scripts/test-admin-pentadbir.mjs
      - run: node scripts/test-school-lists-import.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
